version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: qfstore-qubicflow_frontend_1
      APP_PORT: 80

  backend:
    image: andyqus/qubicflow-backend:0.1.13
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - TZ=UTC
      - APP_PASSWORD=${APP_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: andyqus/qubicflow-frontend:0.1.13
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - backend
